<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eco – Criar Conta</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="login">
  <div class="login-logo"><span>🍃</span> ECO</div>

  <form class="login-card" action="#" method="post">
    <div class="campo">
      <label for="email">Email :</label>
      <div class="entrada">
        <span aria-hidden="true">✉</span>
        <input id="email" type="email" placeholder="seu@email.com" required>
      </div>
    </div>

    <div class="campo">
      <label for="senha">Senha :</label>
      <div class="entrada">
        <span aria-hidden="true">🔒</span>
        <input id="senha" type="password" placeholder="Digite sua senha" required>
      </div>
    </div>

    <div class="campo">
      <label for="confirmar-senha">Confirmar Senha :</label>
      <div class="entrada">
        <span aria-hidden="true">🔒</span>
        <input id="confirmar-senha" type="password" placeholder="Digite sua senha novamente" required>
      </div>
    </div>

    <button class="btn-login claro" type="submit">Criar Conta</button>
    <a class="btn-login escuro" href="login.html">Já tenho uma conta</a>
  </form>

  <a class="voltar" href="index.html" aria-label="Voltar">←</a>
</main>

</body>
</html>
